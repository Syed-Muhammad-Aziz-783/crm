name: Build Royal ERPNext image

on:
  push:
    branches: [royal]
    paths-ignore:
      - ".github/workflows/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/syed-muhammad-aziz-783/royal-erpnext

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Royal GUARD: stop the build if any fork moved away from the frozen commit
      # (for example after a mistaken "Sync fork"). To take new code on purpose,
      # update the SHA below in the same change. See ROYAL_BUILD_NOTES.md.
      - name: Guard - forks must be on the frozen commits
        run: |
          set -e
          check() {
            got=$(git ls-remote "https://github.com/Syed-Muhammad-Aziz-783/$1" refs/heads/version-16 | cut -f1)
            if [ "$got" != "$2" ]; then
              echo "::error::Fork $1 version-16 is at '$got' but frozen at $2. Build stopped on purpose (Sync fork by mistake?). Tell Claude."
              exit 1
            fi
            echo "$1 OK $got"
          }
          check frappe 4515014c87ece6cb20ee91d2cfb121c5cbd1ff4a
          check erpnext 5af6561f5aa48104559692fb4fd82f2580e8d338
          check hrms 2478afc7a8f4959d500f6d17522853f0d244e38f

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Get frappe_docker (official build files)
        run: git clone --depth 1 https://github.com/frappe/frappe_docker.git .

      # Royal: frappe, erpnext and hrms come from OUR forks (frozen on version-16 at the
      # commits listed in ROYAL_BUILD_NOTES.md). Nothing from frappe.io enters unless we merge it.
      - name: Write apps.json
        run: |
          cat > apps.json <<'JSON'
          [
            {"url": "https://github.com/Syed-Muhammad-Aziz-783/erpnext", "branch": "version-16"},
            {"url": "https://github.com/Syed-Muhammad-Aziz-783/hrms", "branch": "version-16"},
            {"url": "https://github.com/Syed-Muhammad-Aziz-783/crm", "branch": "royal"}
          ]
          JSON

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_PATH=https://github.com/Syed-Muhammad-Aziz-783/frappe
            CACHE_BUST=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:v16
            ${{ env.IMAGE }}:sha-${{ github.sha }}
