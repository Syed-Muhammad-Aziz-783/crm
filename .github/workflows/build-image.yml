name: Build Royal ERPNext image

on:
  push:
    branches: [royal]
    paths-ignore:
      - ".github/workflows/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/syed-muhammad-aziz-783/royal-erpnext

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Get frappe_docker (official build files)
        run: git clone --depth 1 https://github.com/frappe/frappe_docker.git .

      # Royal: frappe, erpnext and hrms come from OUR forks (frozen on version-16 at the
      # commits listed in ROYAL_BUILD_NOTES.md). Nothing from frappe.io enters unless we merge it.
      - name: Write apps.json
        run: |
          cat > apps.json <<'JSON'
          [
            {"url": "https://github.com/Syed-Muhammad-Aziz-783/erpnext", "branch": "version-16"},
            {"url": "https://github.com/Syed-Muhammad-Aziz-783/hrms", "branch": "version-16"},
            {"url": "https://github.com/Syed-Muhammad-Aziz-783/crm", "branch": "royal"}
          ]
          JSON

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_PATH=https://github.com/Syed-Muhammad-Aziz-783/frappe
            CACHE_BUST=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:v16
            ${{ env.IMAGE }}:sha-${{ github.sha }}
